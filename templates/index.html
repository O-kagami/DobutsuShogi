<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>どうぶつ将棋 解析センター</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background-color: #fdf6e3; padding: 20px; color: #5d4037; }
        
        /* 盤面を囲むエリア（座標用） */
        .board-container {
            position: relative;
            display: inline-block;
            padding: 30px 40px 10px 40px; /* 上・右・下・左の余白 */
            background: #8d6e63;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            margin-bottom: 20px;
        }

        /* 筋ラベル（３ ２ １） */
        .label-cols {
            position: absolute;
            top: 5px;
            left: 40px;
            display: flex;
            width: 240px;
            justify-content: space-around;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* 段ラベル（一 二 三 四） */
        .label-rows {
            position: absolute;
            left: 5px;
            top: 30px;
            display: flex;
            flex-direction: column;
            height: 400px;
            justify-content: space-around;
            color: white;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            background: #e0c080;
            border: 2px solid #5d4037;
        }

        .cell {
            width: 80px;
            height: 100px;
            border: 1px solid #5d4037;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: white;
        }

        .btn-analyze {
            padding: 15px 30px;
            font-size: 1.2rem;
            background: #5d4037;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-analyze:hover { background: #795548; }
        .btn-analyze:disabled { background: #ccc; }

        #result-area {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            background: white;
            display: none;
            max-width: 300px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .kifu-list {
            text-align: left;
            font-family: monospace;
            font-size: 1.1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1>🐾 どうぶつ将棋 解析センター 🐾</h1>
    
    <div class="board-container">
        <div class="label-cols">
            <span>３</span><span>２</span><span>１</span>
        </div>
        <div class="label-rows">
            <span>一</span><span>二</span><span>三</span><span>四</span>
        </div>
        
        <div class="board">
            {% for r in range(4) %}{% for c in range(3) %}
                <div class="cell">{{ get_emoji(board[r][c]) }}</div>
            {% endfor %}{% endfor %}
        </div>
    </div>

    <br>
    <button class="btn-analyze" id="analyze-btn" onclick="startAnalysis()">解析を開始する</button>

    <div id="loading" style="display:none; margin-top:15px; font-weight: bold;">🤖 AIが全手順を計算中...</div>

    <div id="result-area">
        <h2 id="res-score" style="margin-top:0;" aria-label="解析結果のスコア"></h2>
        <p id="res-time" style="color: #888;"></p>
        <hr>
        <h3 style="margin-bottom: 10px;">📜 最善の手順</h3>
        <div class="kifu-list" id="res-kifu"></div>
    </div>

    <script>
        async function startAnalysis() {
            const btn = document.getElementById('analyze-btn');
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('result-area');
            
            btn.disabled = true;
            loading.style.display = 'block';
            resultArea.style.display = 'none';

            try {
                const response = await fetch('/analyze', { method: 'POST' });
                const data = await response.json();
                
                document.getElementById('res-score').innerText = data.result;
                document.getElementById('res-time').innerText = "計算時間: " + data.time + "秒";
                
                const kifuDiv = document.getElementById('res-kifu');
                kifuDiv.innerHTML = data.kifu.map(line => `<div>${line}</div>`).join('');
                
                resultArea.style.display = 'block';
            } catch (e) {
                alert("エラーが発生しました。");
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
