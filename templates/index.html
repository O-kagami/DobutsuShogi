<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どうぶつ将棋</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>🐾 どうぶつ将棋 🐾</h1>
    <div class="game-container">


        <div class="side-panels">
            <div class="legend-panel">
                <h3>勝つための条件</h3>
                <div class="win-cond-item">
                    <div class="win-grid">
                        <div class="w-cell"></div><div class="w-cell">🦁</div><div class="w-cell"></div>
                        <div class="w-cell"></div><div class="w-cell"></div><div class="w-cell"></div>
                        <div class="w-cell"></div><div class="w-cell"></div><div class="w-cell"></div>
                        <div class="w-cell"></div><div class="w-cell"></div><div class="w-cell"></div>
                    </div>
                    <p class="w-desc"><strong>キャッチ：</strong><br>相手のライオンを捕まえたら勝ち！</p>
                </div>
                <div class="win-cond-item">
                    <div class="win-grid">
                        <div class="w-cell w-goal">●</div><div class="w-cell w-goal">●</div><div class="w-cell w-goal">●</div>
                        <div class="w-cell">🦁</div><div class="w-cell"></div><div class="w-cell"></div>
                        <div class="w-cell"></div><div class="w-cell"></div><div class="w-cell"></div>
                        <div class="w-cell"></div><div class="w-cell"></div><div class="w-cell"></div>
                    </div>
                    <p class="w-desc"><strong>トライ：</strong><br>自分のライオンが敵陣の1段目に入ったら勝ち！<br><small>※すぐ取られる場合は不可</small></p>
                </div>
                <div class="win-cond-item">
                    <p class="w-desc"><strong>相手の指し手がない：</strong><br>自分の手番で動かせる駒がなくなったら負け！</p>
                </div>
            </div>

            <div class="legend-panel">
                <h3>駒の動き（先手）</h3>
                <div class="legend-item"><span class="piece-icon">🦁</span><div class="mini-grid">
                    <div class="m-cell h"></div><div class="m-cell h"></div><div class="m-cell h"></div>
                    <div class="m-cell h"></div><div class="m-cell c">🦁</div><div class="m-cell h"></div>
                    <div class="m-cell h"></div><div class="m-cell h"></div><div class="m-cell h"></div>
                </div></div>
                <div class="legend-item"><span class="piece-icon">🦒</span><div class="mini-grid">
                    <div class="m-cell"></div><div class="m-cell h"></div><div class="m-cell"></div>
                    <div class="m-cell h"></div><div class="m-cell c">🦒</div><div class="m-cell h"></div>
                    <div class="m-cell"></div><div class="m-cell h"></div><div class="m-cell"></div>
                </div></div>
                <div class="legend-item"><span class="piece-icon">🐘</span><div class="mini-grid">
                    <div class="m-cell h"></div><div class="m-cell"></div><div class="m-cell h"></div>
                    <div class="m-cell"></div><div class="m-cell c">🐘</div><div class="m-cell"></div>
                    <div class="m-cell h"></div><div class="m-cell"></div><div class="m-cell h"></div>
                </div></div>
                <div class="legend-item"><span class="piece-icon">🐥</span><div class="mini-grid">
                    <div class="m-cell"></div><div class="m-cell h"></div><div class="m-cell"></div>
                    <div class="m-cell"></div><div class="m-cell c">🐥</div><div class="m-cell"></div>
                    <div class="m-cell"></div><div class="m-cell"></div><div class="m-cell"></div>
                </div></div>
                <div class="legend-item"><span class="piece-icon">🐔</span><div class="mini-grid">
                    <div class="m-cell h"></div><div class="m-cell h"></div><div class="m-cell h"></div>
                    <div class="m-cell h"></div><div class="m-cell c">🐔</div><div class="m-cell h"></div>
                    <div class="m-cell"></div><div class="m-cell h"></div><div class="m-cell"></div>
                </div></div>
            </div>
        </div>
                <div class="board-area">
            <div class="hand-area" id="hand2"></div>
            <div class="board-container"><div id="board" class="board"></div></div>
            <div class="hand-area" id="hand1"></div>
        </div>
    </div>

    <div class="controls">
        <div id="win-message"></div>
        
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>
        
        <p id="status-text">あなたの番です</p>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button onclick="undoMove()" style="background:#f39c12;">待った</button>
            <button onclick="location.href='/'" style="background:#888;">やり直す</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
    <script>
        initGame({{ move_options|tojson }}, {{ board|tojson }}, {{ hand1|tojson }}, {{ hand2|tojson }});
    </script>
</body>
</html>
